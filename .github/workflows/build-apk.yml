name: Build Android APK (ChairCare)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (Point to your server, e.g. http://YOUR_SERVER_IP:5000/api/v1)'
        required: false
        default: 'http://localhost:5000/api/v1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: ⚙️ Configure Production Environment Variables (.env)
        run: |
          API_URL="${{ github.event.inputs.api_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="http://localhost:5000/api/v1"
          fi
          echo "EXPO_PUBLIC_API_URL=$API_URL" > .env
          echo "EXPO_PUBLIC_RAZORPAY_KEY_ID=" >> .env
          echo "=== Using .env for APK Build ==="
          cat .env

      - name: 🔨 Generate Native Android Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --clean

      - name: 🔑 Ensure Signing Configuration (Debug Keystore)
        run: |
          # Configure release build to use debug signing so the APK installs on any device without keystore prompt
          cd android/app
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle 2>/dev/null || true
          cd ../..

      - name: 🏗️ Compile Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon
          else
            echo "Building Release APK..."
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          fi
          cd ..

      - name: 📋 Organize APK Artifacts
        run: |
          mkdir -p build-output
          # Copy whatever APK was built to build-output/ChairCare.apk
          FIRST_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -f "$FIRST_APK" ]; then
            cp "$FIRST_APK" build-output/ChairCare.apk
            echo "✅ Successfully copied APK to build-output/ChairCare.apk"
          else
            echo "❌ No APK file was found in android/app/build/outputs/apk"
            exit 1
          fi
          ls -lh build-output/

      - name: 🚀 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChairCare-Android-APK
          path: build-output/ChairCare.apk
          if-no-files-found: error
          retention-days: 30
